  <script charset="UTF-8" class="daum_roughmap_loader_script"
          src="https://ssl.daumcdn.net/dmaps/map_js_init/roughmapLoader.js"></script>
        <script>
            (function () {
                // 각 탭이 어떤 지도를 렌더할지 매핑
                const maps = {
                    "tab-1": {
                        containerId: "daumRoughmapContainer1742170136603",
                        timestamp: "1742170136603",
                        key: "2nchp"
                    },
                    "tab-2": {
                        containerId: "daumRoughmapContainer1768457632624",
                        timestamp: "1768457632624",
                        key: "g2n9sf6jzje"
                    },
                    "tab-3": {
                        containerId: "daumRoughmapContainer1760950103931",
                        timestamp: "1760950103931",
                        key: "2ckd4ghnai4u"
                    }
                };
            
                const rendered = new Set();
            
                function renderMap(panelId) {
                    if (rendered.has(panelId)) return;
                    const m = maps[panelId];
                    if (!m) return;
                
                    // roughmap이 로드된 뒤에만 가능
                    if (!window.daum || !daum.roughmap || !daum.roughmap.Lander) return;
                
                    new daum.roughmap.Lander({
                        timestamp: m.timestamp,
                        key: m.key,
                        // roughmap은 보통 px 문자열을 쓰지만, 환경에 따라 "100%"도 동작하는 케이스가 있습니다.
                        // 만약 "100%"가 적용이 안 되면 아래를 "1165" 같은 px로 고정하거나 CSS로 감싸는 방식으로 조정하세요.
                        mapWidth: "100%",
                        mapHeight: "420"
                    }).render();
                
                    rendered.add(panelId);
                }
            
                function setActive(tabBtn) {
                    const targetId = tabBtn.getAttribute("data-tab");
                
                    // 버튼 활성화
                    document.querySelectorAll(".mapTabs__tab").forEach(btn => {
                        const active = btn === tabBtn;
                        btn.classList.toggle("is-active", active);
                        btn.setAttribute("aria-selected", active ? "true" : "false");
                    });
                
                    // 패널 토글
                    document.querySelectorAll(".mapTabs__panel").forEach(panel => {
                        const active = panel.id === targetId;
                        panel.classList.toggle("is-active", active);
                        panel.hidden = !active;
                    });
                
                    // 지도 렌더
                    renderMap(targetId);
                }
            
                // 이벤트 바인딩
                document.addEventListener("click", function (e) {
                    const btn = e.target.closest(".mapTabs__tab");
                    if (!btn) return;
                    setActive(btn);
                });
            
                // 최초 1번(본사) 렌더
                // loader script가 늦게 로드되는 경우를 대비해 짧게 재시도
                const firstPanel = "tab-1";
                let tries = 0;
                const t = setInterval(() => {
                    tries++;
                    renderMap(firstPanel);
                    if (rendered.has(firstPanel) || tries > 30) clearInterval(t);
                }, 100);
            })();
        </script>
