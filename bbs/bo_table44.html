                <script type="module">
                    import { initServerPagination } from '/js/pagination.js?v=__BUILD__';
                  
                    function escapeHTML(str) {
                      return (str ?? '')
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#039;')
                        .replace(/\n/g, "<br />");
                    }

                    function isPastDate(dateStr) {
                        // dateStr: "2026-01-21" 또는 "2026-01-21T10:30:00"
                        const today = new Date();
                        today.setHours(0, 0, 0, 0);

                        const target = new Date(dateStr);
                        target.setHours(0, 0, 0, 0);

                        return target < today;
                    }
                  
                    document.addEventListener('DOMContentLoaded', function () {
                      initServerPagination({
                        containerSelector: '.test_list',
                        paginationSelector: '.pagination',
                        itemsPerPage: 10,
                        pageGroupSize: 5,
                        useLocalStorage: true,
                        localStorageKey: 'lastPage-table44',
                  
                        // 핵심: 서버에서 page 단위로 가져오기
                        fetchPage: async (page) => {
                          // 서버가 1-based라 가정: page=1,2,3...
                          // 서버가 0-based면 page-1로 바꾸세요.
                          const size = 10;
                  
                          const lang = window.localStorage.getItem('lang');

                          const res = await api.get(lang == "ko" ? '/recruit/posts' : '/recruit/posts/en', {
                            params: { page }
                          });
                  
                          // 1) 권장 응답 형태: { items, totalPages }
                          if (res.data?.items && res.data?.totalPages != null) {
                            return { items: res.data.items, totalPages: res.data.totalPages };
                          }
                  
                          // 2) Spring Page 형태 대응: { content, totalPages, number(0-based) ... }
                          if (res.data?.content && res.data?.totalPages != null) {
                            return { items: res.data.content, totalPages: res.data.totalPages };
                          }
                  
                          // 3) 임시: 서버가 아직 totalPages를 안 주면 (비추천)
                          // 이 경우 페이지네이션을 만들 수 없으므로 서버 수정이 필요합니다.
                          throw new Error('Server paging response must include items/content and totalPages.');
                        },
                  
                        renderItem: (data) => `
                          <tr>
                            <td style="text-align:center;width:5vw">${data.rowNum}</td>
                            <td style="padding:10px 20px;min-width:30vw">
                              <a href="/bbs/bo_table44_detail.html?param1=${data.haSn}">
                                ${isPastDate(data.haEndDt) ? escapeHTML(data.haTitle)+" "+"(마감)" : data.haTitle}
                              </a>
                            </td>
                            <td style="text-align:center;width:5vw">${data.haViewCnt}</td>
                            <td style="text-align:center;width:6vw">${data.haWriterName}</td>
                            <td style="text-align:center;width:8vw">${(data.haCreateDt || '').slice(0,10)}</td>
                            <td style="text-align:center;width:8vw">${(data.haUpdateDt || '').slice(0,10)}</td>
                          </tr>
                        `
                      });
                    });
