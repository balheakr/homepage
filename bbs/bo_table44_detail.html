<script type="module">
        
    let sharedUrl = "";
    // URL에서 파라미터를 추출하는 함수
    function getQueryParams() {
        const params = new URLSearchParams(window.location.search);
        const param1 = params.get('param1'); // param1 값을 가져옴
        return { param1 };
    }

    function goToRecruit() {
        const params = getQueryParams();
        window.open("about:blank").location.href = `${sharedUrl}`;
    }

    function escapeHTML(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;')
            .replace(/\n/g, "<br />");
    }

    function formatFileSize(bytes) {
        if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
        if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return bytes + ' B';
    }

    function isPastDate(dateStr) {
        // dateStr: "2026-01-21" 또는 "2026-01-21T10:30:00"
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const target = new Date(dateStr);
        target.setHours(0, 0, 0, 0);

        return target < today;
    }

    document.addEventListener('DOMContentLoaded', function() {
        const params = getQueryParams();
        const lang = window.localStorage.getItem('lang');
        api.get(lang == "ko" ? `/news/posts/${params.param1}` : `/news/posts/en/${params.param1}`)
        .then(response => {
            const params = getQueryParams();
            document.querySelector("#sh_bo_v .tit").textContent = `${isPastDate(response.data.haEndDt) ? escapeHTML(response.data.haTitle)+" "+"(마감)" : response.data.haTitle}`;
            document.getElementById('date').insertAdjacentHTML('afterend', `${response.data.haCreateDt.slice(0,10)}`);
            document.getElementById('update').insertAdjacentHTML('afterend', `${response.data.haUpdateDt?.slice(0,10) || ""}`);
            document.getElementById('view').insertAdjacentHTML('afterend', `${response.data.haViewCnt}`);
            sharedUrl = response.data.haUrl;

            // 이미지 출력
            const imgBox = document.getElementById('bo_v_img');
            imgBox.innerHTML = '';
            if(response.data.haImageUrls && response.data.haImageUrls.length > 0) {
                response.data.haImageUrls.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.alt = "";
                    img.style.maxWidth = '100%';
                    img.style.marginBottom = '10px';
                    imgBox.appendChild(img);
                });
            };

            // 텍스트 출력 (XSS 방지 + 줄바꿈 처리)
            const text = response.data.haText;
            if(text) {
                document.getElementById('bo_v_text').innerHTML = `${text}`;
            }

            // 첨부파일 출력
            const fileBox = document.getElementById('bo_v_file');
            fileBox.innerHTML = ''; // 기존 내용 초기화

            if(response.data.files && response.data.files.length > 0) {
                const heading = document.createElement('h4');
                heading.textContent = '첨부파일';
                fileBox.appendChild(heading);

                const ul = document.createElement('ul');

                response.data.files.forEach(file => {
                    const li = document.createElement('li');

                    const a = document.createElement('a');
                    a.href = file.hfPath;
                    a.download = file.hfName;
                    a.textContent = `📎 ${file.hfName} `;

                    const span = document.createElement('span');
                    span.textContent = `(${formatFileSize(file.hfSize || 0)})`;
                    span.style.color = 'gray';
                    span.style.fontSize = '0.9em';

                    a.appendChild(span);
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                fileBox.appendChild(ul);
            }
        })
        .catch(error => {
            console.error('데이터 로드 실패:', error);
        });
    });
</script>
