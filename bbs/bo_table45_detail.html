<script>
    let sharedUrl = "";
    // URL에서 파라미터를 추출하는 함수
    function getQueryParams() {
        const params = new URLSearchParams(window.location.search);
        const param1 = params.get('param1'); // param1 값을 가져옴
        return { param1 };
    }

    function goToNews() {
        const params = getQueryParams();
        window.open("about:blank").location.href = `${sharedUrl}`;
    }

    function escapeHTML(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;')
            .replace(/\n/g, "<br />");
    }

    function formatFileSize(bytes) {
        if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
        if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return bytes + ' B';
    }

    document.addEventListener('DOMContentLoaded', function() {
        const params = getQueryParams();
        axios.get(`https://api-dev.balhea.kr/homebe/api/news/posts/${params.param1}`)
        .then(response => {
            const params = getQueryParams();
            document.querySelector("#sh_bo_v .tit").textContent = `${response.data.haTitle}`;
            document.getElementById('date').insertAdjacentHTML('afterend', `${response.data.haCreateDt.slice(0,10)}`);
            document.getElementById('update').insertAdjacentHTML('afterend', `${response.data.haUpdateDt?.slice(0,10) || ""}`);
            document.getElementById('view').insertAdjacentHTML('afterend', `${response.data.haViews}`);
            sharedUrl = response.data.haUrl;

            // 이미지 출력
            const imgBox = document.getElementById('bo_v_img');
            imgBox.innerHTML = '';
            if(response.data.haImageUrls && response.data.haImageUrls.length > 0) {
                response.data.haImageUrls.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.alt = "";
                    img.style.maxWidth = '100%';
                    img.style.marginBottom = '10px';
                    imgBox.appendChild(img);
                });
            };

            // 텍스트 출력 (XSS 방지 + 줄바꿈 처리)
            const text = response.data.haText;
            if(text) {
                document.getElementById('bo_v_text').innerHTML = `${text}`;
            }

            // 첨부파일 출력
            const fileBox = document.getElementById('bo_v_file');
            fileBox.innerHTML = ''; // 기존 내용 초기화

            if(response.data.haAttachmentsUrls && response.data.haAttachmentsUrls.length > 0) {
                const heading = document.createElement('h4');
                heading.textContent = '첨부파일';
                fileBox.appendChild(heading);

                const ul = document.createElement('ul');

                response.data.haAttachmentsUrls.forEach(file => {
                    const li = document.createElement('li');

                    const a = document.createElement('a');
                    a.href = file.url;
                    a.download = file.name;
                    a.textContent = `📎 ${file.name} `;

                    const span = document.createElement('span');
                    span.textContent = `(${formatFileSize(file.size || 0)})`;
                    span.style.color = 'gray';
                    span.style.fontSize = '0.9em';

                    a.appendChild(span);
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                fileBox.appendChild(ul);
            }
        })
        .catch(error => {
            console.error('데이터 로드 실패:', error);
        });
    });
</script>
