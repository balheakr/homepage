                <script type="module">
                    import axios from 'https://cdn.jsdelivr.net/npm/axios@1.6.8/+esm';
                    import { initPagination } from '/js/pagination.js';

                    function escapeHTML(str) {
                        return str
                            .replace(/&/g, '&amp;')
                            .replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;')
                            .replace(/"/g, '&quot;')
                            .replace(/'/g, '&#039;')
                            .replace(/\n/g, "<br />");
                    }

                    function formatFileSize(bytes) {
                        if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
                        if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' KB';
                        return bytes + ' B';
                    }

                    document.addEventListener('DOMContentLoaded', function() {
                        axios.get(`https://api-dev.balhea.kr/homebe/api/news/posts`)
                        .then(response => {
                            if(response.data.content.length != 0) {
                                initPagination({
                                    data: response.data.content,
                                    containerSelector: '.test_list',
                                    paginationSelector: '.pagination',
                                    itemsPerPage: 10,
                                    pageGroupSize: 5,
                                    useLocalStorage: true,
                                    localStorageKey: 'lastPage-table18',
                                    renderItem: (data) => `
                                        <tr>
                                            <td style="text-align: center;">${data.hn_post_sn}</td>
                                            <td style="padding: 10px 20px;width: 600px"><a href="/bbs/board_table18_detail.html?param1=${data.hn_post_sn}">${data.hn_status ? escapeHTML(data.hn_title)+" "+"("+data.hn_status+")" : data.hn_title}</a></td>
                                            <td style="text-align: center;">${data.hn_view}</td>
                                            <td style="text-align: center;">${data.hn_writer_sn}</td>
                                            <td style="text-align: center;">${data.hn_create_dt}</td>
                                        </tr>
                                    `
                                });
                            } else {
                                const tr = document.createElement('tr');
                                const td = document.createElement('td');
                                td.colSpan = 5;
                                td.style.textAlign = 'center';
                                td.textContent = '조회된 목록이 없습니다.';
                                tr.appendChild(td);
                                document.querySelector('.test_list').appendChild(tr);
                            }
                        })
                        .catch(error => {
                            console.error('데이터 로드 실패:', error);
                            const tr = document.createElement('tr');
                            const td = document.createElement('td');
                            td.colSpan = 5;
                            td.style.textAlign = 'center';
                            td.textContent = '조회된 목록이 없습니다.';
                            tr.appendChild(td);
                            document.querySelector('.test_list').appendChild(tr);
                        });
                    });
