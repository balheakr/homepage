<div class="site-footer">
    <div id="sh_ft">
        <div class="inner">
            <div class="ft_logo"><img src="../sh_img/hd/top_menu/NEO-BH_RGB_White.webp" alt="NEO BH" width="700" height="265" /></div>
            <div class="info" data-i18n="footer.address" data-i18n-html="true"></div>
            <div class="cs">
                <span>Contact us</span>
                <div class="info">
                    <p>031-987-3069</p>
                    <ul>
                        <li>E-mail . support@neobh.kr</li>
                        <li>Fax . 031-998-3069</li>
                    </ul>
                </div>
            </div>
        </div>
    </div> 
    <script>
        $(function(){
            var link = $('#navbar a');
            link.on('click', function(e){
                var target = $($(this).attr('href'));

                if (target.length) {
                    $('html, body').animate({
                        scrollTop: target.offset().top
                    }, 600);
                }

                $(this).parent('li').addClass('active');
                e.preventDefault();
            });
            let ticking = false;

            $(window).on('scroll', function(){
                if (!ticking) {
                    window.requestAnimationFrame(function(){
                        findPosition();
                        ticking = false;
                    });

                    ticking = true;
                }
            });

            findPosition();

            function findPosition(){

            const scrollTop = $(window).scrollTop();

            $('section').each(function(){

                if( ($(this).offset().top - scrollTop) < 500){
                    $('#navbar').removeClass();
                    link.parent('li').removeClass('active');
                    $('#navbar')
                        .find('[data-scroll="'+ $(this).attr('id') +'"]')
                        .parent('li')
                        .addClass('active');

                    $('#navbar').addClass($(this).attr('id'));
                }

            });

            const $footer = $("#sh_ft");

            if ($footer.length && $footer.offset().top - scrollTop < 700) {
                $('#navbar').removeClass();
                $('#navbar').addClass('section02');
            }
        }
        });
    </script>
</div>
