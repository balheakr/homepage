        <script>
            const slides = document.querySelector('.catalog_slider .slides');
            const slideImages = document.querySelectorAll('.catalog_slider img');
            let index = 0;

            document.querySelector('.next').addEventListener('click', () => {
                index = (index + 1) % slideImages.length;
                slides.style.transform = `translateX(-${index * 100}%)`;
            });

            document.querySelector('.prev').addEventListener('click', () => {
                index = (index - 1 + slideImages.length) % slideImages.length;
                slides.style.transform = `translateX(-${index * 100}%)`;
            });

    <script>

        $(window).on("scroll",function(){
